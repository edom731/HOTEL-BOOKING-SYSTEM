{% extends 'base.html' %}
{% block title %}Sign In - EthioStay{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6rem 1rem 3rem;background:linear-gradient(135deg,var(--dark),var(--dark-2));">
  <div style="width:100%;max-width:440px;">
    <div class="form-card">
      <div style="text-align:center;margin-bottom:2rem;">
        <div style="font-size:3rem;margin-bottom:0.5rem;">🔑</div>
        <h1 style="font-family:'Playfair Display',serif;font-size:2rem;">Welcome Back</h1>
        <p class="text-muted" style="margin-top:0.4rem;">Sign in to your EthioStay account</p>
      </div>

      {% if form.non_field_errors %}
      <div class="alert alert-error">{{ form.non_field_errors.0 }}</div>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" placeholder="Your username" autofocus required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">Sign In 🔑</button>
      </form>
      <p style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--text-muted);">
        Don't have an account? <a href="{% url 'register' %}" style="color:var(--gold);">Create one free</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
